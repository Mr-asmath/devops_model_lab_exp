name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Debug - List all files and directories
        run: |
          echo "Current working directory:"
          pwd
          echo ""
          echo "All files and directories (including hidden):"
          ls -la
          echo ""
          echo "Directory structure (first 2 levels):"
          find . -maxdepth 2 -type d | sort
          echo ""
          echo "Searching for Java files:"
          find . -name "*.java" -type f

      - name: Compile Java program
        run: |
          echo "=== Compiling ==="
          # Create directory structure if needed
          mkdir -p target/classes
          
          # Find and compile Java files
          if [ -d "src/main/java" ]; then
            javac -d target/classes $(find src/main/java -name "*.java")
          elif [ -f "App.java" ]; then
            javac -d target/classes App.java
          elif [ -f "com/example/App.java" ]; then
            javac -d target/classes com/example/App.java
          else
            echo "No Java files found!"
            exit 1
          fi

      - name: Run Java program
        run: |
          echo "=== Running ==="
          if [ -d "src/main/java" ]; then
            java -cp target/classes com.example.App
          elif [ -f "App.java" ]; then
            java -cp target/classes App
          elif [ -f "com/example/App.java" ]; then
            java -cp target/classes com.example.App
          else
            echo "Cannot find main class!"
            exit 1
          fi
