jobs:
  build:
    runs-on: ubuntu-latest
    # Force the runner to use Node.js 24 to clear the deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      # Use latest versions that support Node 24
      - uses: actions/checkout@v4.2.2 
      - name: Set up JDK
        uses: actions/setup-java@v4.5.0 
        with:
          java-version: '17' # Ensure this matches your project
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
