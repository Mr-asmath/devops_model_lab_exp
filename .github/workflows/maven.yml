name: Java CI with Maven

on:
  push:
    branches: [ "main" ]    # Change "main" if your branch is named "master"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Resolves the Node.js 20 deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Use v6+ for checkout to ensure Node 24 support
      - uses: actions/checkout@v6 

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'      # Change this to '11' or '21' if needed
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # We removed --file pom.xml to let Maven find it automatically in the root
        # If your project is in a subfolder, use: cd folder_name && mvn -B package
        run: mvn -B package
