name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Debug - List all files and directories
        run: |
          echo "Current working directory:"
          pwd
          echo ""
          echo "All files and directories (including hidden):"
          ls -la
          echo ""
          echo "Directory structure (first 2 levels):"
          find . -maxdepth 2 -type d | sort
          echo ""
          echo "Searching for pom.xml files:"
          find . -name "pom.xml" -type f

      - name: Build with Maven
        run: |
          # If pom.xml is in current directory
          if [ -f "pom.xml" ]; then
            echo "Found pom.xml in root directory"
            mvn -B package
          # If pom.xml is in a subdirectory (find first level pom.xml)
          elif [ -f $(find . -maxdepth 2 -name "pom.xml" -type f | head -1) ]; then
            POM_DIR=$(dirname $(find . -maxdepth 2 -name "pom.xml" -type f | head -1))
            echo "Found pom.xml in: $POM_DIR"
            cd $POM_DIR
            mvn -B package
          else
            echo "Error: No pom.xml found in root or first level subdirectories"
            echo "Please check the repository structure above"
            exit 1
          fi
