name: Java CI with Maven

# This section is mandatory
on:
  push:
    branches: [ "main" ]    # Run when you push code to main
  pull_request:
    branches: [ "main" ]    # Run when a pull request is opened against main
  workflow_dispatch:        # Optional: Adds a "Run workflow" button in the UI

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
